name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Test native and WebAssembly foundation
        run: npm --prefix engine test
  geometry-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Compare independent geometry with pinned upstream
        run: npm --prefix engine run test:geometry:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-comparisons
          path: engine/artifacts/geometry/
  preparation-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OSU_REFERENCE_CHECKOUT: ${{ github.workspace }}/engine/.reference/osu
      OSU_FRAMEWORK_CHECKOUT: ${{ github.workspace }}/engine/.reference/framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install linkers and pinned Odin
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          npm --prefix engine run setup
      - name: Fetch pinned upstream checkouts
        run: |
          git init "$OSU_REFERENCE_CHECKOUT"
          git -C "$OSU_REFERENCE_CHECKOUT" remote add origin https://github.com/ppy/osu.git
          git -C "$OSU_REFERENCE_CHECKOUT" fetch --depth=1 origin 3c1c96f742e7aae2ff67a7361e058fe91ca3b955
          git -C "$OSU_REFERENCE_CHECKOUT" checkout --detach FETCH_HEAD
          git init "$OSU_FRAMEWORK_CHECKOUT"
          git -C "$OSU_FRAMEWORK_CHECKOUT" remote add origin https://github.com/ppy/osu-framework.git
          git -C "$OSU_FRAMEWORK_CHECKOUT" fetch --depth=1 origin f02756c5aa5032e6d04729922702b8d56c4bc2eb
          git -C "$OSU_FRAMEWORK_CHECKOUT" checkout --detach FETCH_HEAD
      - name: Compare complete preparation with pinned upstream
        run: npm --prefix engine run test:prepared:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-comparisons
          path: |
            engine/artifacts/prepared/
            engine/artifacts/acceptance.json
  simulation-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OSU_REFERENCE_CHECKOUT: ${{ github.workspace }}/engine/.reference/osu
      OSU_FRAMEWORK_CHECKOUT: ${{ github.workspace }}/engine/.reference/framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ppy/osu
          ref: 3c1c96f742e7aae2ff67a7361e058fe91ca3b955
          path: engine/.reference/osu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ppy/osu-framework
          ref: f02756c5aa5032e6d04729922702b8d56c4bc2eb
          path: engine/.reference/framework
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Compare independent M2 primitives with pinned upstream
        run: npm --prefix engine run test:simulation:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-comparisons
          path: engine/artifacts/simulation/

  browser-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install linkers and pinned Odin
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          npm --prefix engine run setup
      - name: Build production browser engine
        run: npm --prefix engine run build
      - name: Install pinned browser dependencies
        run: npm --prefix platform/browser-js ci
      - name: Test browser services and assemble player
        run: |
          npm --prefix platform/browser-js test
          npm --prefix platform/browser-js run build
      - name: Install browser engines
        run: npm exec --prefix platform/browser-js -- playwright install --with-deps chromium firefox webkit
      - name: Test browser foundation
        run: npm --prefix platform/browser-js run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-foundation
          path: platform/browser-js/artifacts/browser-results*
