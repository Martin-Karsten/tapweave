name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Install pinned browser dependencies
        run: npm --prefix platform/browser-js ci
      - name: Test native and WebAssembly foundation
        run: npm --prefix engine test
  geometry-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Compare independent geometry with pinned upstream
        run: npm --prefix engine run test:geometry:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-comparisons
          path: engine/artifacts/geometry/
  preparation-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OSU_REFERENCE_CHECKOUT: ${{ github.workspace }}/engine/.reference/osu
      OSU_FRAMEWORK_CHECKOUT: ${{ github.workspace }}/engine/.reference/framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers and pinned Odin
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          npm --prefix engine run setup
      - name: Fetch pinned upstream checkouts
        run: |
          git init "$OSU_REFERENCE_CHECKOUT"
          git -C "$OSU_REFERENCE_CHECKOUT" remote add origin https://github.com/ppy/osu.git
          git -C "$OSU_REFERENCE_CHECKOUT" fetch --depth=1 origin 3c1c96f742e7aae2ff67a7361e058fe91ca3b955
          git -C "$OSU_REFERENCE_CHECKOUT" checkout --detach FETCH_HEAD
          git init "$OSU_FRAMEWORK_CHECKOUT"
          git -C "$OSU_FRAMEWORK_CHECKOUT" remote add origin https://github.com/ppy/osu-framework.git
          git -C "$OSU_FRAMEWORK_CHECKOUT" fetch --depth=1 origin f02756c5aa5032e6d04729922702b8d56c4bc2eb
          git -C "$OSU_FRAMEWORK_CHECKOUT" checkout --detach FETCH_HEAD
      - name: Install pinned browser dependencies
        run: npm --prefix platform/browser-js ci
      - name: Compare complete preparation with pinned upstream
        run: npm --prefix engine run test:prepared:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-comparisons
          path: |
            engine/artifacts/prepared/
            engine/artifacts/acceptance.json
  simulation-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OSU_REFERENCE_CHECKOUT: ${{ github.workspace }}/engine/.reference/osu
      OSU_FRAMEWORK_CHECKOUT: ${{ github.workspace }}/engine/.reference/framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ppy/osu
          ref: 3c1c96f742e7aae2ff67a7361e058fe91ca3b955
          path: engine/.reference/osu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ppy/osu-framework
          ref: f02756c5aa5032e6d04729922702b8d56c4bc2eb
          path: engine/.reference/framework
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned Odin
        run: npm --prefix engine run setup
      - name: Compare independent M2 primitives with pinned upstream
        run: npm --prefix engine run test:simulation:upstream
      - name: Compare gameplay test ports with pinned drawables and Player
        run: npm --prefix engine run test:gameplay:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-comparisons
          path: |
            engine/artifacts/simulation/
            engine/artifacts/gameplay/

  browser-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers and pinned Odin
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          npm --prefix engine run setup
      - name: Build production browser engine
        run: npm --prefix engine run build
      - name: Install pinned browser dependencies
        run: npm --prefix platform/browser-js ci
      - name: Typecheck browser runtime
        run: npm --prefix platform/browser-js run typecheck
      - name: Test browser services and assemble player
        run: |
          npm --prefix platform/browser-js test
          npm --prefix platform/browser-js run build
      - name: Install browser engines
        run: npm exec --prefix platform/browser-js -- playwright install --with-deps ${{ matrix.browser }}
      - name: Install software graphics support
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Test browser foundation
        run: xvfb-run -a npm --prefix platform/browser-js run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-foundation-${{ matrix.browser }}
          path: platform/browser-js/artifacts/browser-results*

  product-shell:
    runs-on: ubuntu-24.04
    # Browser coverage plus serial, real-time multiplayer rounds exceed 20 minutes.
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache pinned Odin
        uses: actions/cache@v4
        with:
          path: engine/.toolchain/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/toolchain.json') }}
      - name: Install linkers and pinned Odin
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          npm --prefix engine run setup
      - name: Build production browser engine
        run: npm --prefix engine run build
      - name: Install pinned browser dependencies
        run: npm --prefix platform/browser-js ci
      - name: Install pinned shell dependencies
        run: npm --prefix platform/product-ui ci
      - name: Install pinned Workers test dependencies
        run: npm --prefix platform/product-ui/worker-tests ci
      - name: Prepare product assets and multiplayer engine identity
        run: npm --prefix platform/product-ui run prepare-assets
      - name: Typecheck product shell
        run: npm --prefix platform/product-ui run typecheck
      - name: Install browser engines
        run: npm exec --prefix platform/product-ui -- playwright install --with-deps chromium firefox webkit
      - name: Install software graphics support
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Run product shell gate suite
        run: npm --prefix platform/product-ui run test:gates
        env:
          PROBE_SECONDS: '10'
      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tapweave_ci
          pactl set-default-sink tapweave_ci
      - name: Test product shell browsers
        run: xvfb-run -a npm --prefix platform/product-ui run test:browser
      - name: Package tested deployment
        run: npm --prefix platform/product-ui run build:deployment
      - name: Test multiplayer Worker and browser coordination
        run: |
          npm --prefix platform/product-ui run typecheck:worker
          npm --prefix platform/product-ui run test:worker
          xvfb-run -a npm --prefix platform/product-ui run test:multiplayer
      - name: Verify Cloudflare asset hosting
        run: |
          npm --prefix platform/product-ui run test:hosting:assets
          npm --prefix platform/product-ui run test:hosting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-shell
          path: platform/product-ui/artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: product-site
          path: platform/product-ui/artifacts/deployment/
          if-no-files-found: error

  deploy:
    needs: [foundation, geometry-reference, preparation-reference, simulation-reference, browser-foundation, product-shell]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tapweave-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix platform/product-ui ci
      - run: npm exec --prefix platform/product-ui -- playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: product-site
          path: platform/product-ui/artifacts/deployment/
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          latest_commit=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$latest_commit" ]; then
            echo "Cannot resolve main" >&2
            exit 1
          fi
          if [ "$latest_commit" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy tested artifact and verify public site
        if: steps.current.outputs.publish == 'true'
        run: npm --prefix platform/product-ui run deploy:ci
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
